# This server shares the connector-only Unix socket with the guest virtual host.
# Cloudflare supplies the client IP and the original HTTPS scheme.
map $http_cf_connecting_ip $api_client_ip {
    default "";
    "~^[0-9a-fA-F.:]{3,45}$" $http_cf_connecting_ip;
}
limit_req_zone $api_client_ip zone=delvane_api_clients:1m rate=10r/s;
limit_req_zone $api_client_ip zone=delvane_api_login:1m rate=6r/m;
limit_conn_zone $server_name zone=delvane_api_total:1m;

server {
    listen unix:/run/delvane-guest-uat/origin.sock;
    server_name api.delvane.app;
    limit_conn delvane_api_total 20;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    if ($http_host != api.delvane.app) { return 404; }
    if ($http_x_forwarded_proto != https) { return 404; }
    if ($api_client_ip = "") { return 404; }

    # FastAPI additionally checks the exact method/path and approved session.
    location = /api/login {
        limit_req zone=delvane_api_login burst=5 nodelay;
        include /etc/delvane-permanent-uat/native-upstream.conf;
    }
    location /api/ {
        limit_req zone=delvane_api_clients burst=35 nodelay;
        include /etc/delvane-permanent-uat/native-upstream.conf;
    }
    location / { return 404; }
}
