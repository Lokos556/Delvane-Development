# Start in the UAT application's network namespace. The only listener is a
# host Unix socket. The application's TCP loopback stays inside its namespace.
user nobody nogroup;
worker_processes 1;
daemon off;
pid /run/delvane-guest-uat/nginx.pid;
error_log /dev/null crit;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;

    map "$request_method:$request_uri" $guest_route {
        default 0;
        "~^(GET|HEAD):/guest/checkin/[A-Za-z0-9_-]{43}$" 1;
        "~^(GET|POST):/api/public/checkin/[A-Za-z0-9_-]{43}$" 1;
        "~^(GET|HEAD):/static/(guest-checkin\.(css|js)|guest-checkin-i18n\.js|delvane-icon\.png)(\?v=[A-Za-z0-9_-]{1,64})?$" 1;
        "POST:/api/public/guest-delivery/resend-webhook" 2;
    }

    # Header presence is an ingress filter. FastAPI authenticates the original
    # body with the signing secret before looking up or mutating any receipt.
    map "$guest_route:$http_svix_id:$http_svix_timestamp:$http_svix_signature" $resend_headers_missing {
        default 0;
        "~^2:[A-Za-z0-9_.-]+:[0-9]+:.+$" 0;
        "~^2:" 1;
    }
    map $guest_route $resend_id { default ""; 2 $http_svix_id; }
    map $guest_route $resend_timestamp { default ""; 2 $http_svix_timestamp; }
    map $guest_route $resend_signature { default ""; 2 $http_svix_signature; }

    # Only the dedicated connector can reach the socket. Cloudflare replaces
    # CF-Connecting-IP. Drop arbitrary forwarded headers and operator cookies.
    map $http_cf_connecting_ip $guest_ip {
        default 127.0.0.1;
        "~^[0-9a-fA-F.:]{3,45}$" $http_cf_connecting_ip;
    }
    limit_conn_zone $guest_ip zone=guest_clients:1m;
    limit_conn_zone $server_name zone=guest_total:1m;

    server {
        listen unix:/run/delvane-guest-uat/origin.sock default_server;
        server_name guest.delvane.app;
        limit_conn guest_clients 8;
        limit_conn guest_total 32;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 10s;
        keepalive_timeout 10s;
        send_timeout 10s;

        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            if ($http_host != guest.delvane.app) { return 404; }
            if ($http_x_forwarded_proto != https) { return 404; }
            if ($guest_route = 0) { return 404; }
            if ($resend_headers_missing) { return 401; }

            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host guest.delvane.app;
            proxy_set_header X-Forwarded-For $guest_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Svix-Id $resend_id;
            proxy_set_header Svix-Timestamp $resend_timestamp;
            proxy_set_header Svix-Signature $resend_signature;
            proxy_set_header Connection close;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Set-Cookie;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 20s;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
