name: delvane_business
description: "Delvane Business — a calm workspace for hospitality operations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  material_ui: 1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/delvane-icon.png
    - assets/web-locales.json
    - assets/native-hu.json
